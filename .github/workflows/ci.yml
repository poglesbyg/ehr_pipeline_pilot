name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v

  eval-gate:
    # Release gate: every gold case (recall, abstention, safety, injection) must pass.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluation harness (VA feeds, scope attacks)
        run: python -m hl7bridge eval --out eval-report.md
      - name: Evaluation harness (Synthea long records via FHIR R4)
        run: python -m hl7bridge eval --gold eval/gold-synthea.json --out eval-synthea.md
      - name: Publish reports
        if: always()
        run: cat eval-report.md eval-synthea.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            eval-report.md
            eval-synthea.md
